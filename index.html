<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Harga Toko Sembako | Harga Terbaru & Stok Lengkap</title>
    <meta name="description" content="Daftar harga sembako terbaru dan lengkap. Cek harga beras, minyak goreng, gula, telur, dan kebutuhan pokok lainnya dengan informasi stok real-time.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Floating Particles Background -->
    <div class="particles" id="particles"></div>

    <!-- Header -->
    <header class="header" id="header">
        <div class="header-container">
            <div class="logo-section">
                <div class="logo-icon">
                    <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect width="40" height="40" rx="10" fill="url(#logoGrad)"/>
                        <path d="M10 28L12 14H28L30 28C30 29.1 29.1 30 28 30H12C10.9 30 10 29.1 10 28Z" fill="white" opacity="0.9"/>
                        <path d="M14 14V12C14 9.79 15.79 8 18 8H22C24.21 8 26 9.79 26 12V14" stroke="white" stroke-width="2" stroke-linecap="round"/>
                        <circle cx="17" cy="22" r="2" fill="url(#logoGrad)"/>
                        <circle cx="23" cy="22" r="2" fill="url(#logoGrad)"/>
                        <defs>
                            <linearGradient id="logoGrad" x1="0" y1="0" x2="40" y2="40">
                                <stop stop-color="#6366f1"/>
                                <stop offset="1" stop-color="#8b5cf6"/>
                            </linearGradient>
                        </defs>
                    </svg>
                </div>
                <div class="logo-text">
                    <h1>Toko Sembako</h1>
                    <p class="tagline">Harga Terjangkau, Kualitas Terjaga</p>
                </div>
            </div>
            <div class="header-actions">
                <div class="last-updated" id="lastUpdated">
                    <span class="pulse-dot"></span>
                    <span>Terakhir diupdate: -</span>
                </div>
                <button class="btn-admin" id="btnAdmin" title="Panel Admin">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                    <span>Admin</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Search & Filter Bar -->
    <section class="search-section">
        <div class="search-container">
            <div class="search-box" id="searchBox">
                <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"/>
                    <path d="M21 21l-4.35-4.35"/>
                </svg>
                <input type="text" id="searchInput" placeholder="Cari produk sembako..." autocomplete="off">
                <button class="search-clear" id="searchClear" style="display:none;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
                </button>
            </div>
            <div class="filter-tabs" id="filterTabs">
                <button class="filter-tab active" data-category="semua">Semua</button>
                <button class="filter-tab" data-category="beras">Beras</button>
                <button class="filter-tab" data-category="minyak">Minyak</button>
                <button class="filter-tab" data-category="gula">Gula & Bumbu</button>
                <button class="filter-tab" data-category="telur">Telur & Susu</button>
                <button class="filter-tab" data-category="mie">Mie & Tepung</button>
                <button class="filter-tab" data-category="minuman">Minuman</button>
                <button class="filter-tab" data-category="lainnya">Lainnya</button>
            </div>
        </div>
    </section>

    <!-- Stats Cards -->
    <section class="stats-section">
        <div class="stats-container">
            <div class="stat-card">
                <div class="stat-icon stat-icon-products">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
                </div>
                <div class="stat-info">
                    <span class="stat-number" id="totalProducts">0</span>
                    <span class="stat-label">Total Produk</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon stat-icon-stock">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
                </div>
                <div class="stat-info">
                    <span class="stat-number" id="totalStock">0</span>
                    <span class="stat-label">Total Stok</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon stat-icon-available">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
                </div>
                <div class="stat-info">
                    <span class="stat-number" id="availableProducts">0</span>
                    <span class="stat-label">Tersedia</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon stat-icon-empty">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                </div>
                <div class="stat-info">
                    <span class="stat-number" id="emptyStock">0</span>
                    <span class="stat-label">Stok Habis</span>
                </div>
            </div>
        </div>
    </section>

    <!-- Product Grid -->
    <main class="main-content">
        <div class="products-container">
            <div class="products-header">
                <h2 id="categoryTitle">Semua Produk</h2>
                <span class="product-count" id="productCount">0 produk</span>
            </div>
            <div class="products-grid" id="productsGrid">
                <!-- Products will be injected here -->
            </div>
            <div class="empty-state" id="emptyState" style="display:none;">
                <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round">
                    <circle cx="11" cy="11" r="8"/>
                    <path d="M21 21l-4.35-4.35"/>
                    <path d="M8 11h6"/>
                </svg>
                <h3>Produk Tidak Ditemukan</h3>
                <p>Coba kata kunci lain atau pilih kategori yang berbeda</p>
            </div>
        </div>
    </main>

    <!-- Admin Modal -->
    <div class="modal-overlay" id="adminModal">
        <div class="modal" id="adminModalContent">
            <div class="modal-header">
                <h2>
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
                    Panel Admin
                </h2>
                <button class="modal-close" id="modalClose">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
                </button>
            </div>
            <div class="modal-body">
                <!-- Admin Tabs -->
                <div class="admin-tabs">
                    <button class="admin-tab active" data-tab="edit">Edit Harga & Stok</button>
                    <button class="admin-tab" data-tab="add">Tambah Produk</button>
                </div>

                <!-- Edit Tab -->
                <div class="admin-tab-content active" id="tabEdit">
                    <div class="admin-search">
                        <input type="text" id="adminSearch" placeholder="Cari produk untuk diedit...">
                    </div>
                    <div class="admin-product-list" id="adminProductList">
                        <!-- Admin product items will be injected here -->
                    </div>
                </div>

                <!-- Add Tab -->
                <div class="admin-tab-content" id="tabAdd">
                    <form id="addProductForm" class="add-form">
                        <div class="form-group">
                            <label for="productName">Nama Produk</label>
                            <input type="text" id="productName" placeholder="Contoh: Beras Premium 5kg" required>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="productPrice">Harga (Rp)</label>
                                <input type="number" id="productPrice" placeholder="Contoh: 65000" min="0" required>
                            </div>
                            <div class="form-group">
                                <label for="productStock">Stok</label>
                                <input type="number" id="productStock" placeholder="Contoh: 50" min="0" required>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="productUnit">Satuan</label>
                                <select id="productUnit">
                                    <option value="pcs">Pcs</option>
                                    <option value="kg">Kg</option>
                                    <option value="liter">Liter</option>
                                    <option value="pack">Pack</option>
                                    <option value="bungkus">Bungkus</option>
                                    <option value="botol">Botol</option>
                                    <option value="karung">Karung</option>
                                    <option value="dus">Dus</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="productCategory">Kategori</label>
                                <select id="productCategory">
                                    <option value="beras">Beras</option>
                                    <option value="minyak">Minyak</option>
                                    <option value="gula">Gula & Bumbu</option>
                                    <option value="telur">Telur & Susu</option>
                                    <option value="mie">Mie & Tepung</option>
                                    <option value="minuman">Minuman</option>
                                    <option value="lainnya">Lainnya</option>
                                </select>
                            </div>
                        </div>
                        <button type="submit" class="btn-add-product">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                            Tambah Produk
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-container">
            <p>&copy; 2026 Toko Sembako &mdash; Harga dapat berubah sewaktu-waktu</p>
        </div>
    </footer>

    <script src="app.js"></script>
</body>
</html>
